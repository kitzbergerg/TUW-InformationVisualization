<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Climate Visualization</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
<div class="app-container">
    <header class="dashboard-header">
        <div class="header-content">
            <h1>Climate Visualisation</h1>
        </div>
        <div class="header-controls" style="display:flex; gap:15px; align-items:center;">
            <label for="variable-select">Variable</label><select id="variable-select" class="dark-input"></select>
            <label for="year-select">Year</label><select id="year-select" class="dark-input"></select>
            <label for="month-select">Month</label><select id="month-select" class="dark-input"></select>
            <label for="country-select">Country</label><select id="country-select" class="dark-input"></select>
        </div>
        <div class="header-authors">
            <span>Kitzberger Gabriel</span>
            <span>Ziegler Daniel</span>
            <span>Marić Vladimir</span>
        </div>
    </header>

    <div class="dashboard-grid" id="main-grid">
        <main class="card map-panel" id="viz-area">
            <div id="map-container"></div>
        </main>

        <div class="card pc-panel" id="pc-panel">
            <h3>Multivariate Comparison</h3>
            <div id="pc-container"></div>
        </div>

        <div class="card history-panel" id="history-panel">
            <h3>Climate History</h3>
            <div id="line-container"></div>
        </div>
    </div>
</div>

<script src="js/worldMap.js"></script>
<script src="js/historyChart.js"></script>
<script src="js/pcPlot.js"></script>
<script src="js/main.js"></script>
</body>
</html>
